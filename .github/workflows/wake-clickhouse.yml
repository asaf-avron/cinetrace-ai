# Re-enable the live ticker the day before judging so ClickHouse is awake
# when a judge opens the URL. GitHub cron has no year field; this fires
# every 21 Sep at 15:00 UTC (18:00 IDT / 08:00 PDT).
name: Wake ClickHouse before judging

on:
  schedule:
    - cron: "0 15 21 9 *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: cinetrace-ai
  REGION: us-central1
  SERVICE: cinetrace

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: false

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Describe current revision (no secrets)
        run: |
          gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='yaml(status.url,status.traffic,spec.template.metadata.annotations,spec.template.spec.containerConcurrency,spec.template.spec.timeoutSeconds,spec.template.spec.containers[0].resources,spec.template.spec.containers[0].startupProbe,spec.template.spec.containers[0].env.name)'

      - name: Enable live ticker
        run: |
          # max-instances=1 + min-instances=1 leaves no slot for a new
          # revision to pass its startup probe. Raise to 2 for the flip.
          # cpu-boost / 2 vCPU give the new revision enough start CPU.
          gcloud run services update "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --max-instances=2 \
            --cpu=2 \
            --cpu-boost \
            --no-cpu-throttling \
            --memory=2Gi \
            --update-env-vars LIVE_TICKER_ENABLED=true \
            --quiet

      - name: Confirm ticker is on
        run: |
          URL=$(gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')
          sleep 20
          curl -fsS "${URL}/api/health" | tee /tmp/health.json
          python3 -c '
          import json
          health = json.load(open("/tmp/health.json"))
          live = health.get("live") or {}
          assert live.get("enabled") is True, health
          print("ticker is on")
          '

      - name: Dump recent Cloud Run logs on failure
        if: failure()
        run: |
          echo "=== recent cinetrace revision logs (text only) ==="
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="cinetrace"' \
            --project "${PROJECT_ID}" \
            --limit 80 \
            --freshness=30m \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)'
